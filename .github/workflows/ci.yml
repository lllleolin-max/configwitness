name: normal-wheel
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip install dist/configwitness-0.1.0-py3-none-any.whl
      - run: python -c "import configwitness; assert 'site-packages' in configwitness.__file__; print(configwitness.__file__)"
      - run: python -m unittest discover -s tests -v
      - run: python tools/workflow.py
      - run: python tools/contrast.py
